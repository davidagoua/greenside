# Coolify deployment for davidagoua/greenside.
#
# Drop this file at the repository root and point the Coolify Application's
# "Docker Compose Location" at it (Base Directory: /).
#
# How it differs from docker-compose.yml (local dev), and why:
#
#   * PostGIS, not plain Postgres. migrations/001_init.sql runs
#     `CREATE EXTENSION postgis`, locations.geom is GEOMETRY(Point,4326), and the
#     backend's /health endpoint calls PostGIS_Version() — a plain postgres image
#     fails at the first migration.
#   * No `ports:` and no `container_name`. Coolify's proxy owns ingress, and
#     fixed container names collide with Coolify's own naming.
#   * No hardcoded `localhost`. Services reach each other by Compose service name
#     on the stack network; public URLs come from Coolify's generated
#     SERVICE_URL_* values, so the same file works on any domain.
#   * CORS_ORIGINS, PUBLIC_API_URL and FRONTEND_URL are set explicitly. The
#     backend defaults them to http://localhost:*, which silently breaks every
#     browser call the moment the app is served from a real domain.
#
# Secrets are generated by Coolify (SERVICE_PASSWORD_*, SERVICE_BASE64_*) and
# persist across deployments under Configuration > Environment Variables.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenside
      POSTGRES_DB: greenside
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenside -d greenside"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  openinary:
    # Mutable tag: pin it once the first deployment reports its digest.
    image: openinary/openinary:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      MODE: api
      OPENINARY_GENERATE_API_KEY: "true"
      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_BETTERAUTH}
      BETTER_AUTH_URL: ${SERVICE_URL_OPENINARY_3000}
      NEXT_PUBLIC_API_BASE_URL: ${SERVICE_URL_OPENINARY_3000}
      SERVICE_FQDN_OPENINARY_3000: /
    volumes:
      - openinary-data:/app/data
      - openinary-public:/app/apps/api/public
      - openinary-cache:/app/apps/api/cache

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://greenside:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/greenside
      JWT_SECRET: ${SERVICE_BASE64_64_JWT}
      RUN_MIGRATIONS_ON_STARTUP: "true"
      MEDIA_LOCAL_DIR: /app/media
      MEDIA_MAX_SIZE_MB: "5"
      # Internal hop (backend -> openinary), stays on the stack network.
      OPENINARY_URL: http://openinary:3000
      # Public hop (browser -> openinary).
      OPENINARY_PUBLIC_URL: ${SERVICE_URL_OPENINARY_3000}
      # Empty means the backend stores uploads on its own volume instead of
      # using openinary. Set it after reading the key openinary generates.
      OPENINARY_API_KEY: ${OPENINARY_API_KEY:-}
      PUBLIC_API_URL: ${SERVICE_URL_BACKEND_8000}
      FRONTEND_URL: ${SERVICE_URL_FRONTEND_3000}
      # Pydantic parses a complex type as JSON, hence the array literal.
      CORS_ORIGINS: '["${SERVICE_URL_FRONTEND_3000}"]'
      SERVICE_FQDN_BACKEND_8000: /
    volumes:
      - backend-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      openinary:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Read at container start by Nuxt runtimeConfig.public, so the public URLs
      # do not have to be known at image build time.
      NUXT_PUBLIC_API_BASE_URL: ${SERVICE_URL_BACKEND_8000}/api/v1
      NUXT_PUBLIC_OPENINARY_URL: ${SERVICE_URL_OPENINARY_3000}
      SERVICE_FQDN_FRONTEND_3000: /
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  openinary-data:
  openinary-public:
  openinary-cache:
  backend-media:
