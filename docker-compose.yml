version: '3.8'

services:
  openinary:
    image: openinary/openinary:latest
    container_name: eco_openinary
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - openinary_db:/app/data
      - openinary_storage:/app/apps/api/public
      - openinary_cache:/app/apps/api/cache
    environment:
      - PORT=3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-default_super_secret_better_auth_key_min32chars}
      - BETTER_AUTH_URL=http://localhost:8080
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
      - NODE_ENV=production
      - MODE=api
      - OPENINARY_GENERATE_API_KEY=true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eco_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/postgres}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      - OPENINARY_URL=http://openinary:3000
      - OPENINARY_PUBLIC_URL=http://localhost:8080
      - OPENINARY_API_KEY=${OPENINARY_API_KEY:-}
      - MEDIA_LOCAL_DIR=/app/media
      - PUBLIC_API_URL=http://localhost:8000
      - RUN_MIGRATIONS_ON_STARTUP=true
    depends_on:
      - openinary

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eco_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NUXT_PUBLIC_OPENINARY_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  openinary_db:
  openinary_storage:
  openinary_cache:
  backend_media:
